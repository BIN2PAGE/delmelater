<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<pre id="log"></pre>
<script>
var o=document.getElementById("log");
function log(m){o.textContent+=m+"\n";}

// 모든 eqstpay 이벤트 캡처
var origDispatch=EventTarget.prototype.dispatchEvent;
EventTarget.prototype.dispatchEvent=function(event){
  if(event&&event.type&&event.type.indexOf("eqstpay")>=0){
    log("EVENT:"+event.type+" detail="+JSON.stringify(event.detail));
  }
  return origDispatch.call(this,event);
};

log("loaded, interceptor active");

window.addEventListener("eqstpay:scn01:ticket",function(e){
  var t=e.detail&&e.detail.ticket;
  if(!t)return;
  try{window.ReactNativeWebView.postMessage(JSON.stringify({channel:"WEB_SESSION",action:"EXCHANGE",ticket:t}));}catch(x){}
});

// REPORT/READ 안 보냄 — Runner가 자동으로 뭘 보내는지 관찰
</script>
</body>
</html>
