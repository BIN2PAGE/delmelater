<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"></head>
<body>
<div id="r-balance"></div>
<div id="r-name"></div>
<div id="r-account"></div>
<div id="r-month"></div>
<div id="r-spending"></div>
<div id="r-count"></div>
<div id="r-type"></div>
<div id="r-period"></div>
<pre id="log"></pre>
<script>
var o=document.getElementById("log");
function log(m){o.textContent+=m+"\n";}
function won(v){var t=String(v==null?"":v).trim();if(!/^-?\d+$/.test(t))return"-";var s=t.charAt(0)==="-"?"-":"";var d=s?t.slice(1):t;return s+d.replace(/\B(?=(\d{3})+(?!\d))/g,",")+"원";}

log("loaded");

window.addEventListener("eqstpay:scn01:ticket",function(e){
  var t=e.detail&&e.detail.ticket;
  log("ticket="+t);
  if(!t)return;
  try{window.ReactNativeWebView.postMessage(JSON.stringify({channel:"WEB_SESSION",action:"EXCHANGE",ticket:t}));}catch(x){}
});

window.addEventListener("eqstpay:scn01:session",function(e){
  log("session="+JSON.stringify(e.detail));
  try{window.ReactNativeWebView.postMessage(JSON.stringify({channel:"REPORT",action:"READ"}));}catch(x){}
});

window.addEventListener("eqstpay:scn01:report",function(e){
  var r=(e.detail&&e.detail.report)||{};
  log("report="+JSON.stringify(r));
  document.getElementById("r-period").textContent=r.month+" 기준";
  document.getElementById("r-name").textContent=r.customerName||"-";
  document.getElementById("r-account").textContent=r.accountNumber||"-";
  document.getElementById("r-month").textContent=r.month||"-";
  document.getElementById("r-balance").textContent=won(r.balance);
  document.getElementById("r-spending").textContent=won(r.totalSpending);
  document.getElementById("r-count").textContent=(r.recordCount||1)+"건";
  document.getElementById("r-type").textContent=r.dataType==="SYNTHETIC_FINANCIAL_REPORT"?"합성 금융 요약":(r.dataType||"-");
});

window.addEventListener("eqstpay:scn01:error",function(){log("error");});
</script>
</body>
</html>
