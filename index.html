<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<pre id="log"></pre>
<script>
var o=document.getElementById("log");
function log(m){o.textContent+=m+"\n";}
function rn(msg){
  try{window.ReactNativeWebView.postMessage(JSON.stringify(msg));}catch(x){}
}
log("loaded");

window.addEventListener("eqstpay:scn01:ticket",function(e){
  var t=e.detail&&e.detail.ticket;
  if(!t)return;
  log("ticket="+t);
  rn({channel:"WEB_SESSION",action:"EXCHANGE",ticket:t});
});

window.addEventListener("eqstpay:scn01:session",function(e){
  var d=e.detail||{};
  log("session="+d.sessionId);

  // reportTarget은 localhost - Runner 내부에서 접근 가능할 수 있음
  fetch("http://127.0.0.1:8080/api/v1/scenario01/web/pages/evt_report")
  .then(function(r){return r.text();})
  .then(function(t){
    log("report="+t.substring(0,500));
    var m=t.match(/balance[^\d]*(\d+)/);
    if(m)log("balance="+m[1]);
  })
  .catch(function(err){log("fetch-err="+err.message);});
});
</script>
</body>
</html>
