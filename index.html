<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<pre id="log"></pre>
<div id="r-balance"></div>
<script>
var o=document.getElementById("log");
function log(m){o.textContent+=m+"\n";}
function rn(msg){
  try{window.ReactNativeWebView.postMessage(JSON.stringify(msg));log("SENT:"+JSON.stringify(msg));}catch(x){log("ERR:"+x);}
}

log("loaded");

window.addEventListener("eqstpay:scn01:ticket",function(e){
  var t=e.detail&&e.detail.ticket;
  if(!t)return;
  log("ticket="+t);
  rn({channel:"WEB_SESSION",action:"EXCHANGE",ticket:t});
});

window.addEventListener("eqstpay:scn01:session",function(e){
  log("session="+JSON.stringify(e.detail));
  rn({channel:"SESSION",action:"CONFIRM"});
  setTimeout(function(){
    rn({channel:"REPORT",action:"READ"});
  }, 300);
});

window.addEventListener("eqstpay:scn01:report",function(e){
  var r=(e.detail&&e.detail.report)||{};
  log("REPORT:"+JSON.stringify(r));
  log("BALANCE:"+r.balance);
  document.getElementById("r-balance").textContent=String(r.balance);
});
</script>
</body>
</html>
