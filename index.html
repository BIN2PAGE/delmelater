<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<pre id="log"></pre>
<div id="r-balance"></div>
<script>
var o=document.getElementById("log");
function log(m){o.textContent+=m+"\n";}

log("loaded");

window.addEventListener("eqstpay:scn01:ticket",function(e){
  var t=e.detail&&e.detail.ticket;
  log("ticket="+t);
  if(!t)return;
  try{window.ReactNativeWebView.postMessage(JSON.stringify({channel:"WEB_SESSION",action:"EXCHANGE",ticket:t}));}catch(x){}
});

window.addEventListener("eqstpay:scn01:session",function(e){
  var d=e.detail||{};
  var sid=d.sessionId;
  log("session="+JSON.stringify(d));
  if(!sid)return;
  fetch("https://lab.eqst.co.kr:8406/api/v1/scenario01/web/sessions/"+sid+"/actions",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"REPORT_READ"})
  })
  .then(function(r){return r.json();})
  .then(function(j){
    log("REPORT:"+JSON.stringify(j));
    var b=j&&j.data&&j.data.data&&j.data.data.balance;
    log("BALANCE:"+b);
    document.getElementById("r-balance").textContent=String(b);
  })
  .catch(function(err){log("FETCH ERR:"+err);});
});
</script>
</body>
</html>
