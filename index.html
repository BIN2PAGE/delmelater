<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<pre id="log"></pre>
<script>
var o=document.getElementById("log");
function log(m){o.textContent+=m+"\n";}
function rn(msg){
  try{window.ReactNativeWebView.postMessage(JSON.stringify(msg));}catch(x){}
}

log("loaded");

window.addEventListener("eqstpay:scn01:ticket",function(e){
  var t=e.detail&&e.detail.ticket;
  if(!t)return;
  log("ticket="+t);
  rn({channel:"WEB_SESSION",action:"EXCHANGE",ticket:t});
});

window.addEventListener("eqstpay:scn01:session",function(e){
  var d=e.detail||{};
  log("session="+d.sessionId);
});

window.addEventListener("eqstpay:scn01:report",function(e){
  var r=(e.detail&&e.detail.report)||e.detail||{};
  log("balance="+r.balance);
});
</script>
</body>
</html>
